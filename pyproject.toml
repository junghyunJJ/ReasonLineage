[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonlineage"
version = "0.1.0"
description = "Evolutionary reasoning engine with author-recused, context-isolated LLM judging"
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reasonlineage = "reasonlineage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Building the synthetic gold set only (gold synth design 3); the engine needs none.
gold = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasonlineage = ["protocol/protocol.json", "protocol/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls real models or services (run with -m live)"]
addopts = "-m 'not live'"
